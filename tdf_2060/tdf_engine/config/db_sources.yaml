# DB sources mapping — Phase C.
#
# 9개 MVO asset_key ↔ SCIP back_dataset.id / back_dataseries.id 매핑.
# 본 파일은 "어디서 어떤 시계열을 가져올지"만 정의한다.
# DB credential 은 환경변수 / 별도 파이썬 모듈에서 관리 (이 파일에 secrets 두지 말 것).
#
# field 명세:
#   asset_key:        AssetClassInfo.asset_key
#   dataset_id:       SCIP.back_dataset.id (직접 매핑)
#   ticker:           디버그용 라벨 (필수 아님)
#   value_dataseries: 가격 또는 수익률을 담는 dataseries_id
#                     기본 6 (FG Return) 우선, 없으면 39 (Total Return Index Unhedged)
#   currency:         data blob 이 dict 형식일 때 추출할 키 (USD/KRW). 단일 숫자 blob 이면 무시.
#   frequency:        기대 빈도 (D=일/M=월). 검증용.
#   required:         true 이면 데이터 부재 시 ValueError.
#   proxy:            아래 ust30 처럼 mapping_mode 가 proxy 일 때만 사용.
#
#   semantic_type:    데이터 의미 분류 (Phase C.1).
#                       total_return_index | price_index | nav | return_series
#                         → MVO 입력에 그대로 사용 가능
#                       yield | spread | macro_indicator
#                         → return_transform 명시 없이는 ValueError (조용한 변환 금지)
#   return_transform: 시계열 → 월간 수익률 변환 방식.
#                       pct_change      : level_t / level_{t-1} - 1
#                       diff            : level_t - level_{t-1}  (raw spread/yield 차분)
#                       already_return  : 입력이 이미 수익률
#                       duration_proxy  : (Phase C.1 미구현) yield × duration 추정
#                       not_allowed     : MVO 입력에 사용 불가 (즉시 ValueError)
#
# 알려진 dataset_id (CLAUDE.md 기준):
#   현재 매핑 (2026-05-27 dataseries 통일 적용):
#     273=KAP 종합채권 TR AA- (KBPMKTMB, ds=9),
#     278=BBG US Aggregate Bond Index (LHMN0001, ds=39, ds=9 부재),
#     318=M2US000G Index (ds=9), 319=M2US000V Index (ds=9),
#     320=M2EA Index (ds=9), 321=M2EF Index (ds=9),
#     398=M2KR Index (ds=9), 401=BBG US HY TR (LF98TRUU, ds=9),
#     408=Gold Spot Price (XAU Curncy, ds=48 PX_LAST),
#     421=KRX 10년채권지수 (KTBITR, ds=9).
#   과거 매핑 (history):
#     11=Vanguard Growth ETF (이전 us_growth_equity, ds=6, ETF NAV),
#     12=Vanguard Value ETF (이전 us_value_equity), 31=USD/KRW,
#     37=Vanguard FTSE EM ETF (이전 em_equity),
#     63=MSCI EAFE iShares ETF (이전 dm_ex_us_equity 초기),
#     144=iShares MSCI Korea ETF EWY-US (이전 kr_equity),
#     201=KIS US30Y TR BRFUT004 (이전 us_treasury_30y, dict blob, 폐기),
#     400=BBG US Long Treasury TR LTXUTRUU (이전 us_treasury_long, 폐기),
#     403=VIX, 404=US HY OAS Spread (level 아님 - 사용 금지).
#
# null 값은 "운영자 결정 필요" 의 의미. DBMarketDataRepository 가
# null 을 만나면 명시적 ValueError (silent fallback 금지).

regime_source:
  # 경기지표 (OECD CLI G7 등) — solution.roboadvisorAPI_economicregime 사용 후보.
  # Phase C 1차 구현은 default file repo 사용. db 모드에서도 fallback 가능.
  table: roboadvisorAPI_economicregime
  database: solution
  date_column: date            # 실제 컬럼명은 운영자가 schema 확인 후 채움
  region_column: region
  value_column: value
  enabled: false               # Phase C 1차: 미사용. file repo 우선.

regime_return_source:
  # 자산별 월간 지수 — back_datapoint 기반 자산군별 월말 시계열 추출.
  enabled: false               # Phase C 1차: file repo 우선.

asset_rt_vol:
  # σ, E[R] 산출 정책.
  # Phase C 1차: file repo (Asset_rt_vol) 우선.
  # db 모드는 동일 형식 DataFrame 을 산출하기 위해 dataset_id 별 시계열로 σ, E[R] 자체 계산 필요.
  computation_mode: from_timeseries  # from_timeseries | from_static_table
  lookback_years: 10
  return_field: value_pct_change      # 월간 / 일간 수익률 → 연환산
  annualization: 12                   # 월간 빈도 가정
  # Phase D D-03 closed (2026-05-08, 운용역 sign-off): Option C — Hybrid.
  # asset_rt_vol 은 자산별 max history 사용 (load_asset_rt_vol 의 기존 동작).
  # 짧은 history 자산도 min_obs 만족하면 허용. short history 는 telemetry/warning 으로 노출.
  intersection_policy: asset_specific
  min_obs: 12

corr_matrix:
  computation_mode: from_timeseries
  lookback_years: 10
  # Phase D D-03 closed (2026-05-08): corr 은 common intersection.
  # load_corr_matrix 의 dropna(how="any") 동작과 정합. effective obs 는 가장 짧은 자산이 결정.
  # 본 정책은 silent contraction 이 아닌 운용역 승인 정책임을 명시.
  intersection_policy: common
  short_history_warning_ratio: 0.8       # max_obs * 0.8 미만 → short_history telemetry/warning

# ── 10 자산군별 매핑 ─────────────────────────────────────────────────
# 2026-05-27 — dataseries 통일 적용. equity 4종은 MSCI 지수 본체로 교체.
# dataseries 9 (Bloomberg TOT RETURN INDEX NET DVDS) 가능 한 자산은 모두 ds=9 사용.
# 예외 2건: us_aggregate_bond (278, ds=9 부재 → ds=39 FG TR Unhedged 사용),
#          gold (408, ds=9 부재 → ds=48 PX_LAST 사용).
assets:

  - asset_key: kr_equity
    # 2026-05-27 — id=144 (EWY-US ETF, ds=6) → id=398 (M2KR Index 본체, ds=9) 교체.
    # ticker = LT-CMA Asset_rt_vol 정본 "M2KR INDEX" (대문자, asset_mapping 정합).
    dataset_id: 398
    ticker: "M2KR INDEX"
    value_dataseries: 9         # TOT RETURN INDEX NET DVDS (Bloomberg)
    fallback_dataseries: null
    currency: null              # 단일 숫자 blob → currency 무시
    frequency: D
    required: true
    semantic_type: total_return_index
    return_transform: pct_change
    notes: |
      SCIP id=398 M2KR Index 본체 (Bloomberg TR Net DVDS). 2000-05 ~ (6640 행).
      이전 id=144 (iShares MSCI South Korea ETF EWY-US, ds=6) 대체 — ETF 추적오차 제거.

  - asset_key: us_growth_equity
    # 2026-05-27 — id=11 (VUG-US ETF, ds=6) → id=318 (M2US000G Index 본체, ds=9) 교체.
    dataset_id: 318
    ticker: "M2US000G Index"
    value_dataseries: 9
    fallback_dataseries: null
    currency: null
    frequency: D
    required: true
    semantic_type: total_return_index
    return_transform: pct_change
    notes: |
      SCIP id=318 M2US000G Index 본체 (Bloomberg TR Net DVDS). 6747 행.
      이전 id=11 (Vanguard Growth ETF VUG-US, ds=6) 대체.

  - asset_key: us_value_equity
    # 2026-05-27 — id=12 (VTV-US ETF, ds=6) → id=319 (M2US000V Index 본체, ds=9) 교체.
    dataset_id: 319
    ticker: "M2US000V Index"
    value_dataseries: 9
    fallback_dataseries: null
    currency: null
    frequency: D
    required: true
    semantic_type: total_return_index
    return_transform: pct_change
    notes: |
      SCIP id=319 M2US000V Index 본체 (Bloomberg TR Net DVDS). 6739 행.
      이전 id=12 (Vanguard Value ETF VTV-US, ds=6) 대체.

  - asset_key: dm_ex_us_equity
    # 2026-05-27 사용자 지정 — id=320 M2EA Index (Bloomberg TR, dataseries=9).
    # 단일 숫자 blob, 1999-12 ~ (4302 행). 이전 id=63 (iShares EAFE ETF) 대체.
    # ticker = LT-CMA 정본 "TAD09XU Index" (asset_mapping 정합). SCIP symbol = M2EA Index.
    dataset_id: 320
    ticker: "TAD09XU Index"
    value_dataseries: 9         # TOT RETURN INDEX NET DVDS (Bloomberg)
    fallback_dataseries: null
    currency: null              # 단일 숫자 blob → currency 무시
    frequency: D
    required: true
    semantic_type: total_return_index
    return_transform: pct_change
    notes: "SCIP id=320 M2EA Index (Bloomberg TR)."

  - asset_key: em_equity
    # 2026-05-27 — id=37 (VWO-US ETF, ds=6) → id=321 (M2EF Index 본체, ds=9) 교체.
    dataset_id: 321
    ticker: "M2EF Index"
    value_dataseries: 9
    fallback_dataseries: null
    currency: null
    frequency: D
    required: true
    semantic_type: total_return_index
    return_transform: pct_change
    notes: |
      SCIP id=321 M2EF Index 본체 (Bloomberg TR Net DVDS). 1999-12 ~ (6888 행).
      이전 id=37 (Vanguard Emerging Markets VWO-US, ds=6) 대체.

  - asset_key: kr_aggregate_bond
    # 2026-05-27 사용자 지정 — id=273 KAP 종합채권 총수익 지수(AA- 이상) (KBPMKTMB Index).
    # dataseries=9 (TOT RETURN INDEX NET DVDS). 단일 숫자 blob. 2001-01 ~ (6364 행).
    # 이전 id=59 (KIS Composite TR / SPBKRCOT) 대체.
    # ticker = LT-CMA 정본 "SPBKRCOT Index" (asset_mapping 정합). SCIP symbol = KBPMKTMB Index.
    dataset_id: 273
    ticker: "SPBKRCOT Index"
    value_dataseries: 9
    fallback_dataseries: null
    currency: null              # 단일 숫자 blob → currency 무시
    frequency: D
    required: true
    semantic_type: total_return_index
    return_transform: pct_change
    notes: "SCIP id=273 KAP 종합채권 총수익 지수(AA- 이상) (KBPMKTMB Index)."

  - asset_key: kr_treasury_10y
    # Phase C.2 — SCIP id=421 KRX 10년채권지수 (KTBITR Index).
    # dataseries=9 (TOT RETURN INDEX NET DVDS). 단일 숫자 blob. 2010~ 시계열.
    dataset_id: 421
    ticker: "KPGB10YR Index"     # asset_mapping 정합. 실 dataset 은 KTBITR (id=421).
    value_dataseries: 9
    fallback_dataseries: null
    currency: null
    frequency: D
    required: true
    semantic_type: total_return_index
    return_transform: pct_change
    notes: |
      SCIP id=421 'KRX 10년채권지수' (KTBITR Index) — TR index. Phase C.2 확정.
      이전 KPGB10YR Index 는 yield only 라 사용 불가 → 본 매핑으로 교체.

  - asset_key: us_aggregate_bond
    # 2026-05-27 — id=278 Bloomberg US Aggregate Bond Index (LHMN0001).
    # LT-CMA (Asset_rt_vol) 의 "미국 채권" = LBUSTRUU Index 와 동일 지수.
    # ds=9 (TOT RETURN INDEX NET DVDS) 본체 부재 → ds=39 (FG Total Return Index Unhedged) 사용.
    # ds=39 는 단일 숫자 blob (TR Unhedged), ds=9 와 의미 가장 유사.
    dataset_id: 278
    ticker: "LBUSTRUU Index"    # LT-CMA 정본 (asset_mapping 정합). SCIP symbol = LHMN0001.
    value_dataseries: 39        # FG Total Return Index (Unhedged) — ds=9 부재로 ds=39 사용
    fallback_dataseries: 6      # ds=6 FG Return (dict USD/KRW) fallback
    currency: null              # ds=39 는 단일 숫자 blob → currency 무시
    frequency: D
    required: true
    semantic_type: total_return_index
    return_transform: pct_change
    notes: |
      SCIP id=278 Bloomberg US Aggregate Bond Index (LHMN0001).
      LT-CMA (Asset_rt_vol) ticker = LBUSTRUU Index. SCIP symbol = LHMN0001. 동일 지수.
      이전 us_treasury_30y (id=201 BRFUT004 KIS US30Y TR, 2019~) / us_treasury_long (id=400 LTXUTRUU Long Treasury TR) 폐기 →
      US Aggregate (Treasury + MBS + Corp + Credit) 가 LT-CMA 정합.
      ds=9 본체 부재 → ds=39 FG Total Return Index Unhedged 사용 (의미 동일, 단일 숫자 blob).

  - asset_key: gold
    # 2026-05-27 사용자 지정 — id=408 Gold Spot Price (XAU Curncy).
    # dataseries=48 PX_LAST. 단일 숫자 문자열 blob ('4534.51' 같은). USD/oz.
    # 2000-01 ~ (6882 행). LT-CMA Asset_rt_vol 에는 Alternative bucket 이지만,
    # 사용자 결정 (2026-05-27): equity bucket 으로 편입.
    dataset_id: 408
    ticker: "XAU Curncy"
    value_dataseries: 48
    fallback_dataseries: null
    currency: null              # 단일 숫자 blob → currency 무시
    frequency: D
    required: true
    semantic_type: price_index
    return_transform: pct_change
    notes: |
      SCIP id=408 Gold Spot Price (XAU Curncy). dataseries=48 PX_LAST (가격 수준).
      LT-CMA Asset_rt_vol 분류 = Alternative. 본 프로젝트는 사용자 결정으로 equity bucket 편입.

  - asset_key: us_high_yield
    # Phase C.2 — SCIP id=401 'Bloomberg US HY TR' (LF98TRUU Index).
    # dataseries=9 (TOT RETURN INDEX NET DVDS). 단일 숫자. 1999~ 풍부.
    dataset_id: 401
    ticker: "LF98TRUU Index"
    value_dataseries: 9
    fallback_dataseries: null
    currency: null
    frequency: D
    required: true
    semantic_type: total_return_index
    return_transform: pct_change
    notes: |
      SCIP id=401 'Bloomberg US HY TR' = LF98TRUU Index. Phase C.2 확정.
      ⚠️ id=404 (HY OAS Spread) 는 절대 사용 금지 (spread level).

# ── 환율 ────────────────────────────────────────────────────────────
