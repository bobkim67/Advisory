# Universe classification rules — Phase C-pre.
#
# 10개 MVO 자산군별 분류 룰. priority 낮을수록 먼저 시도 (좁은 매칭이 광범위 매칭보다 우선).
# 첫 매칭 우선 정책 유지. 매칭 시 match_reason 을 함께 노출한다.
#
# 룰 평가 순서:
#   1) kis_mp_categories: 화이트리스트 (지정 시)
#   2) regions: 화이트리스트 (지정 시)
#   3) name_excludes: 펀드명에 포함되면 매칭 거부
#   4) include_keywords: OR 매칭. 빈 리스트면 카테고리/지역 조건만으로 매칭
#
# Fund 채권 펀드 매칭 보강 (Phase C-pre):
#   - kr_treasury_10y / us_aggregate_bond / kr_aggregate_bond / us_high_yield 모두
#     fund 상품도 매칭되도록 키워드 확장.

classification_rules:

  # ── 1) us_high_yield (가장 좁고 명확한 키워드 — 최우선) ──
  - asset_key: us_high_yield
    priority: 10
    include_keywords:
      - 하이일드
      - High Yield
      - HY
      - Hi-Yield

  # ── 2) gold (금, alternative — 사용자 결정으로 equity bucket) ──
  - asset_key: gold
    priority: 15
    include_keywords:
      - Gold
      - GOLD
      - XAU
      - GLD
      - IAU
      - GLDM
      - 골드
      - KRX금
      - 금ETF
      - 금현물
      - 금선물
    name_excludes:
      - 황금              # "황금..." 류 제외 (실제 금 아닐 가능성)
      # "금" 단독 매칭은 너무 광범위 — "금융", "금리", "예금" 등을 잘못 매칭.
      # 키워드에서 단독 "금" 제거 + 명시적 'KRX금/금ETF/금현물/금선물/Gold/XAU/GLD' 등 좁은 라벨만 사용.

  # ── 3) us_aggregate_bond (미국 종합채권) ──
  - asset_key: us_aggregate_bond
    priority: 20
    include_keywords:
      - 미국채권
      - 미국 채권
      - 미국종합채권
      - 미국 종합채권
      - US Aggregate
      - US Agg
      - Aggregate Bond
      - LBUSTRUU
      - AGG
      - BND
      - 미국투자등급
      - 미국 투자등급
      - 미국우량채
      - 미국채
    name_excludes:
      - 하이일드
      - High Yield
      - 단기
      - 초단기
      # "장기" / "30년" 같은 duration 키워드는 exclude 하지 않음 — Bloomberg US Aggregate 는
      # 장기 회사채/국채 모두 포함하는 광범위 지수.

  # ── 3) kr_treasury_10y (한국 국고채/국공채 장기) ──
  - asset_key: kr_treasury_10y
    priority: 30
    kis_mp_categories: [국내채권]
    include_keywords:
      - 국고채10
      - 국고채 10
      - 국고10년
      - 10년국고
      - 장기국공채
      - 중기국공채
      - 국공채
      - 국채
    name_excludes:
      - 미국
      - 회사채
      - 하이일드
      - 단기
      - 초단기
      - MMF
      - 머니마켓
      - 단기국공채

  # ── 4) kr_aggregate_bond (국내채권 일반) ──
  - asset_key: kr_aggregate_bond
    priority: 40
    kis_mp_categories: [국내채권]
    name_excludes:
      - 국고채10
      - 국고채 10
      - 미국
      - 하이일드

  # ── 5) us_growth_equity ──
  - asset_key: us_growth_equity
    priority: 50
    regions: [미국]
    include_keywords:
      - 성장
      - 그로스
      - Growth
      - 나스닥
      - Nasdaq
      - NASDAQ

  # ── 6) us_value_equity ──
  - asset_key: us_value_equity
    priority: 60
    regions: [미국]
    include_keywords:
      - 가치
      - Value
      - 배당

  # ── 7) em_equity (KIS MP 신흥국주식 카테고리) ──
  - asset_key: em_equity
    priority: 70
    kis_mp_categories: [신흥국주식]

  # ── 7b) em_equity (지역 기반 추가 룰) ──
  - asset_key: em_equity
    priority: 71
    regions:
      - 중국
      - 인도
      - 베트남
      - 인도네시아
      - 브라질
      - 신흥국
      - 멕시코
      - 필리핀
      - 대만
      - 중국+베트남

  # ── 8) dm_ex_us_equity (글로벌주식 + 미국외 지역) ──
  - asset_key: dm_ex_us_equity
    priority: 80
    kis_mp_categories: [글로벌주식]
    regions:
      - 일본
      - 유럽
      - 독일
      - 아시아
      - 글로벌선진국

  # ── 8b) dm_ex_us_equity (펀드명 키워드 — 선진국) ──
  - asset_key: dm_ex_us_equity
    priority: 81
    include_keywords:
      - 선진국

  # ── 9) kr_equity (가장 일반적 — 마지막) ──
  - asset_key: kr_equity
    priority: 90
    kis_mp_categories: [국내주식]
    regions: [국내]
